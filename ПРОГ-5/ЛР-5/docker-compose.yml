version: '3.8'

services:
  glossary-grpc-server:
    build: .
    container_name: python-grpc-glossary
    ports:
      - "50051:50051"
    volumes:
      - ./data:/data
      - ./glossary_data.json:/app/glossary_data.json
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python server/main.py
    healthcheck:
      test: ["CMD", "python", "-c", "
        import grpc
        from grpc_generated import glossary_pb2, glossary_pb2_grpc
        channel = grpc.insecure_channel('localhost:50051')
        stub = glossary_pb2_grpc.GlossaryServiceStub(channel)
        try:
            response = stub.HealthCheck(glossary_pb2.HealthCheckRequest(), timeout=2)
            print('Healthy' if response.status == 'SERVING' else 'Unhealthy')
        except:
            print('Unhealthy')
      "]
      interval: 30s
      timeout: 10s
      retries: 3
  
  glossary-grpc-client:
    build: .
    container_name: python-grpc-client
    depends_on:
      - glossary-grpc-server
    volumes:
      - ./client:/app/client
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    command: tail -f /dev/null  # Контейнер остается запущенным для выполнения команд