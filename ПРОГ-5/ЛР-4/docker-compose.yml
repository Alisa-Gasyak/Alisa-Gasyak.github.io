version: '3.8'

services:
  glossary-api:
    build: .
    container_name: python-glossary-api
    ports:
      - "8000:8000"
    volumes:
      - ./glossary.json:/data/glossary.json
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3